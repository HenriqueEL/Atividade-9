<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <header>
        <div class="logo-texto">
            <img src="assets/imagem/Logo SENAI.png" alt="Logo-SENAI">
            <h1>Cadastro SENAI</h1>
        </div>
        <nav class="botoes">
            <a href="#formulario">Cadastro</a>
            <a href="#tabela">Turma</a>
        </nav>
    </header>

    <main>
        <section id="formulario">
            <h2>Cadastro</h2>
            <form class="form">
                <div id="fnome" class="info">
                    <label class="label" for="name">Nome Completo</label>
                    <input class="input" id="name" type="text" placeholder="Digite seu nome...">
                </div>
                <div id="fdata-nascimento" class="info">
                    <label class="label" for="data">Data de Nascimento</label>
                    <input class="input" id="data" type="date" placeholder="Insira sua data de nascimento...">
                </div>
                <div id="fcargo" class="info">
                    <label class="label" for="cargo-senai">Selecione seu Cargo</label>
                    <select class="input" name="Cargo" id="cargo-senai">
                        <option value=""disable selected>Selecione uma Opção</option>
                        <option value="instru">Instrutor</option>
                        <option value="aln">Aluno</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>

                <div id="fturma" class="info">
                    <label class="label" for="turma-setor">Turma/Setor</label>
                    <input class="input" id="turma-setor" type="text" placeholder="Digite sua Turma ou Setor...">

                </div>
                <div id="fcep" class="info">
                    <label class="label" for="cep">CEP</label>
                    <input class="input" id="cep" type="number" placeholder="Insira seu CEP...">
                </div>
                
                <div id="frua" class="info">
                    <h3 class="label">Rua</h3>
                    <p class="input">Sua Rua</p>
                </div>

                <div id="fnumero" class="info">
                    <label class="label" for="numero">Número</label>
                    <input class="input" id="numero" type="number" placeholder="Digite seu Número...">
                </div>

                <div id="fcomplemento" class="info">
                    <label class="label" for="comple">Complemento</label>
                    <input class="input" id="comple" type="text" placeholder="Digite um Complemento(opcional)">
                </div>

                <div id="fbairro" class="info">
                    <h3 class="label">Bairro</h3>
                    <p class="input">Seu Bairro</p>
                </div>

                <div id="fcidade" class="info">
                    <h3 class="label">Cidade</h3>
                    <p class="input">Sua Cidade</p>
                </div>

                <div id="festado" class="info">
                    <h3 class="label">Estado</h3>
                    <p class="input">Seu Estado</p>
                </div>
                <div id="btn">
                    <button type="button">Submeter</button>
                </div>
            </form>
        </section>

        <section id="tabela">
            <div id="numeroint">
                <h2>Turma</h2>
                <p>Número de Integrantes: <span>0</span></p>
            </div>
            <h2 id="integ">Integrantes</h2>
        </section>
    </main>
</body>
</html>
