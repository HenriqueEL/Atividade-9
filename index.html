<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro SENAI</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script defer src="assets/js/script.js"></script>
</head>
<body id="corpo">
    <header>
        <div class="logo-texto">
            <img src="assets/imagem/Logo SENAI.png" alt="Logo-SENAI">
            <h1>Cadastro SENAI</h1>
        </div>
        <nav class="botoes">
            <a href="#formulario">Cadastro</a>
            <a href="#tabela">Turma</a>
        </nav>
    </header>

    <main>
        <section id="formulario">
            <h2>Cadastro</h2>
            <form class="form">
                <div id="fnome" class="info">
                    <label class="label" for="name">Nome Completo</label>
                    <input class="input" id="inname" type="text" placeholder="Digite seu nome...">
                </div>
                <div id="fdata-nascimento" class="info">
                    <label class="label" for="data">Data de Nascimento</label>
                    <input class="input" id="indata" type="date" placeholder="Insira sua data de nascimento...">
                </div>
                <div id="fcargo" class="info">
                    <label class="label" for="cargo-senai">Selecione seu Cargo</label>
                    <select class="input" name="Cargo" id="incargo">
                        <option value=""disable selected>Selecione uma Opção</option>
                        <option value="Instrutor">Instrutor</option>
                        <option value="Aluno">Aluno</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>

                <div id="fturma" class="info">
                    <label class="label" for="turma-setor">Turma/Setor</label>
                    <input class="input" id="inturset" type="text" placeholder="Digite sua Turma ou Setor...">

                </div>
                <div id="fcep" class="info">
                    <label class="label" for="cep">CEP</label>
                    <input onchange="envcep()" class="input" id="incep" type="number" placeholder="Insira seu CEP...">
                </div>
                
                <div id="frua" class="info">
                    <h3 class="label">Rua</h3>
                    <input id="inrua" class="input" type="text" placeholder="Digite sua rua..."></input>
                </div>

                <div id="fnumero" class="info">
                    <label class="label" for="numero">Número</label>
                    <input id="innum" class="input" type="number" placeholder="Digite seu Número de casa...">
                </div>

                <div id="fcomplemento" class="info">
                    <label class="label" for="comple">Complemento</label>
                    <input id="incomp" class="input" type="text" placeholder="Digite um Complemento(opcional)">
                </div>

                <div id="fbairro" class="info">
                    <h3 class="label">Bairro</h3>
                    <input id="inbairro" class="input" type="text" placeholder="Digite seu bairro..."></input>
                </div>

                <div id="fcidade" class="info">
                    <h3 class="label">Cidade</h3>
                    <input id="incidade" class="input" type="text" placeholder="Digite sua cidade..."></input>
                </div>

                <div id="festado" class="info">
                    <h3 class="label">Estado</h3>
                    <input id="inestado" class="input" type="text" placeholder="Digite seu estado..."></input>
                </div>
                <div id="submt">
                    <button onclick="enviar()" id="btn-submt" class="btn" type="button">Enviar</button>
                </div>
            </form>
        </section>
        <section id="tabela">
            <div id="numeroint">
                <h2>Turma</h2>
                <p>Número de Integrantes: <span id="num-integ"">0</span></p>
            </div>
            <h2 id="integ">Integrantes</h2>
            <div class="tabela-final">
                <table class="table">
                    <thead>
                        <tr>
                            <th class="cbc-tab">Nome</th>
                            <th class="cbc-tab">Cargo</th>
                            <th class="cbc-tab">Data de Nascimento</th>
                            <th class="cbc-tab">Turma/Setor</th>
                            <th class="cbc-tab">Endereço</th>
                            <th class="cbc-tab">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="corp">

                    </tbody>
                </table>
            </div> 
        </section>
    </main>
</body>
</html>
